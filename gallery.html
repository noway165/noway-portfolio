<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thư Viện Ảnh | Tăng Thoại Lâm</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #ff4d00;
            --bg-color: #0a0a0c; 
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
            --nav-bg: rgba(10, 10, 12, 0.85);
            --overlay-edge: rgba(10, 10, 12, 1);
        }

        body.light-mode {
            --primary-color: #d94300; 
            --bg-color: #f4f1ea; 
            --text-main: #1a1a1a; 
            --text-muted: #555555;
            --nav-bg: rgba(244, 241, 234, 0.85);
            --overlay-edge: rgba(244, 241, 234, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        /* ÉP CHUỘT ẨN ĐI ĐỂ DÙNG CHUỘT CUSTOM */
        @media (pointer: fine) {
            body, a, button, .gallery-item {
                cursor: none !important;
            }
        }

        /* CON CHUỘT TÂM NGẮM SÚNG */
        .custom-cursor {
            position: fixed; top: 0; left: 0;
            width: 30px; height: 30px;
            color: var(--primary-color);
            font-size: 24px;
            pointer-events: none; z-index: 100000; 
            transform: translate(-50%, -50%); 
            display: none; justify-content: center; align-items: center;
            text-shadow: 0 0 10px var(--primary-color);
            transition: transform 0.15s ease-out; 
        }
        
        .custom-cursor.aiming {
            transform: translate(-50%, -50%) scale(1.5) rotate(45deg);
            color: #ffffff; text-shadow: 0 0 15px var(--primary-color), 0 0 30px var(--primary-color);
        }

        body, html, h1, h2, h3, h4, h5, h6, p, a, span, div, button { font-family: 'Times New Roman', Times, serif !important; }

        body, html {
            width: 100%; height: 100%; background-color: var(--bg-color); color: var(--text-main);
            overflow-x: hidden; overflow-y: auto; transition: background-color 0.5s ease, color 0.5s ease;
        }

        .smoke-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at center, rgba(255, 77, 0, 0.05) 0%, var(--overlay-edge) 70%); z-index: 1; pointer-events: none; transition: background 0.5s ease; }
        #sparks-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }

        .ui-layer { position: relative; z-index: 10; width: 100%; min-height: 100%; display: flex; flex-direction: column; }

        .nav-right { display: flex; align-items: center; gap: 30px; }
        .theme-toggle { background: transparent; border: 1px solid var(--primary-color); color: var(--primary-color); padding: 5px 15px; border-radius: 20px; font-weight: bold; font-size: 1.2rem; transition: 0.3s; }
        .theme-toggle:hover { background: var(--primary-color); color: var(--bg-color); }

        nav { display: flex; justify-content: space-between; align-items: center; padding: 20px 50px; background: var(--nav-bg); border-bottom: 1px solid rgba(255, 77, 0, 0.3); backdrop-filter: blur(5px); position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 2rem; font-weight: bold; color: var(--primary-color); text-shadow: 0 0 15px rgba(255, 77, 0, 0.4); letter-spacing: 2px; text-transform: uppercase; }
        nav ul { list-style: none; display: flex; gap: 30px; }
        nav ul li a { color: var(--text-main); text-decoration: none; font-size: 1.2rem; text-transform: uppercase; letter-spacing: 1px; transition: 0.3s; padding-bottom: 5px; border-bottom: 2px solid transparent; font-weight: bold; }
        nav ul li a:hover, nav ul li a.active { color: var(--primary-color); border-bottom: 2px solid var(--primary-color); text-shadow: 0 0 8px rgba(255, 77, 0, 0.4); }

        .gallery-content { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 40px 20px 80px 20px; animation: fadeIn 1s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .gallery-content h1 { font-size: 4rem; font-weight: bold; letter-spacing: 2px; margin-bottom: 10px; text-shadow: 2px 4px 10px rgba(0,0,0,0.5); text-transform: uppercase;}
        .gallery-content p { font-size: 1.5rem; color: var(--text-muted); margin-bottom: 40px; font-style: italic; }

        /* LƯỚI ẢNH (GALLERY GRID) */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px; max-width: 1200px; width: 100%;
        }

        .gallery-item {
            position: relative; overflow: hidden; border-radius: 12px;
            border: 2px solid transparent; transition: 0.3s ease;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            /* Ép khung ảnh bằng nhau */
            aspect-ratio: 1 / 1; 
        }

        .gallery-item img {
            width: 100%; height: 100%; object-fit: cover;
            transition: transform 0.5s ease;
        }

        .gallery-item:hover {
            border-color: var(--primary-color);
            box-shadow: 0 0 20px rgba(255, 77, 0, 0.5);
            transform: translateY(-5px);
        }

        .gallery-item:hover img { transform: scale(1.1); filter: brightness(0.7); }

        /* MODAL PHÓNG TO ẢNH (LIGHTBOX) */
        .lightbox-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.95); backdrop-filter: blur(5px);
            z-index: 9999; display: flex; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
        }
        .lightbox-overlay.active { opacity: 1; pointer-events: auto; }

        .lightbox-content {
            position: relative; max-width: 90vw; max-height: 90vh;
            transform: scale(0.8); transition: transform 0.3s ease;
        }
        .lightbox-overlay.active .lightbox-content { transform: scale(1); }

        .lightbox-content img {
            max-width: 100%; max-height: 90vh; border-radius: 8px;
            border: 2px solid var(--primary-color); box-shadow: 0 0 30px rgba(255, 77, 0, 0.5);
        }

        .close-lightbox {
            position: absolute; top: -20px; right: -20px;
            background: rgba(0,0,0,0.8); border: 2px solid var(--primary-color);
            color: var(--primary-color); font-size: 1.5rem; font-weight: bold;
            border-radius: 50%; width: 45px; height: 45px; z-index: 10;
            transition: 0.3s;
        }
        .close-lightbox:hover { background: var(--primary-color); color: #fff; transform: scale(1.1) rotate(90deg); }
    </style>
</head>
<body>

    <!-- CON CHUỘT TÂM NGẮM -->
    <div class="custom-cursor" id="customCursor">
        <i class="fas fa-crosshairs"></i>
    </div>

    <!-- LIGHTBOX (KHUNG PHÓNG TO ẢNH) -->
    <div class="lightbox-overlay" id="lightbox">
        <div class="lightbox-content">
            <button class="close-lightbox" id="closeLightbox">X</button>
            <img src="" alt="Zoomed Image" id="lightboxImg">
        </div>
    </div>

    <div class="smoke-overlay"></div>
    <canvas id="sparks-canvas"></canvas>

    <div class="ui-layer">
        <nav>
            <div class="logo">Gallery</div>
            <div class="nav-right">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="music.html">Music</a></li>
                    <li><a href="gallery.html" class="active">Gallery</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
                <button class="theme-toggle" id="themeBtn">☀️</button>
            </div>
        </nav>

        <div class="gallery-content">
            <h1>My Gallery</h1>
            <p>"Khoảnh khắc đẹp nhất"</p>
            
            <div class="gallery-grid">
                
                <!-- ẢNH SỐ 1 -->
                <!-- Sếp ghi tên ảnh vào chỗ src="..." bên dưới nhé -->
                <div class="gallery-item" onclick="openLightbox(this)">
                    <img src="z7870230747566_aa8bc19aef718cb339132273f03cb1b9.jpg" alt="Photo 1">
                </div>

                <!-- ẢNH SỐ 2 -->
                <div class="gallery-item" onclick="openLightbox(this)">
                    <img src="z7870230763886_026701a4401625119045fcd2bfc9df9b.jpg" alt="Photo 2">
                </div>

                <!-- ẢNH SỐ 3 -->
                <div class="gallery-item" onclick="openLightbox(this)">
                    <img src="z7870230810355_a61e4f4c706c78db0711c27b1b567254.jpg" alt="Photo 3">
                </div>

                <!-- ẢNH SỐ 4 -->
                <div class="gallery-item" onclick="openLightbox(this)">
                    <img src="z7870230804851_ea015128c665f3a89501190e84f00e32.jpg" alt="Photo 4">
                </div>

                <!-- ẢNH SỐ 5 -->
                <div class="gallery-item" onclick="openLightbox(this)">
                    <img src="z7870230812015_2c8d88c5550d06521ed58d32b08e5fc9.jpg" alt="Photo 5">
                </div>

                <!-- ẢNH SỐ 6 -->
                <div class="gallery-item" onclick="openLightbox(this)">
                    <img src="z7870230820931_a7b846fe8db8a128c8c4ab2490739a4d.jpg" alt="Photo 6">
                </div>

            </div>
        </div>
    </div>

    <script>
        /* MỞ / ĐÓNG LIGHTBOX PHÓNG TO ẢNH */
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightboxImg');
        const closeLightboxBtn = document.getElementById('closeLightbox');

        function openLightbox(element) {
            const imgSrc = element.querySelector('img').src; // Lấy nguồn ảnh vừa bấm
            lightboxImg.src = imgSrc; // Đút vào khung phóng to
            lightbox.classList.add('active'); // Hiện khung lên
            customCursor.classList.remove('aiming'); // Tắt hiệu ứng tâm ngắm
        }

        closeLightboxBtn.addEventListener('click', () => {
            lightbox.classList.remove('active');
        });

        // Bấm ra ngoài ảnh cũng tự đóng
        lightbox.addEventListener('click', (e) => {
            if (e.target === lightbox) { lightbox.classList.remove('active'); }
        });

        /* SCRIPT XỬ LÝ CON CHUỘT TÂM NGẮM */
        const customCursor = document.getElementById('customCursor');
        if (window.matchMedia("(pointer: fine)").matches) {
            customCursor.style.display = 'flex';
            document.addEventListener('mousemove', (e) => {
                customCursor.style.left = e.clientX + 'px';
                customCursor.style.top = e.clientY + 'px';
            });
            // Khóa mục tiêu khi rê vào ảnh, link, nút
            const interactiveElements = document.querySelectorAll('a, button, .gallery-item, .close-lightbox');
            interactiveElements.forEach(el => {
                el.addEventListener('mouseenter', () => customCursor.classList.add('aiming'));
                el.addEventListener('mouseleave', () => customCursor.classList.remove('aiming'));
            });
        }

        /* SCRIPT SÁNG/TỐI */
        const themeBtn = document.getElementById('themeBtn');
        const body = document.body;
        if (localStorage.getItem('theme') === 'light') {
            body.classList.add('light-mode'); themeBtn.innerText = '🌙';
        } else {
            themeBtn.innerText = '☀️';
        }
        themeBtn.addEventListener('click', () => {
            body.classList.toggle('light-mode');
            if (body.classList.contains('light-mode')) {
                themeBtn.innerText = '🌙'; localStorage.setItem('theme', 'light');
            } else {
                themeBtn.innerText = '☀️'; localStorage.setItem('theme', 'dark');
            }
        });

        /* SCRIPT HẠT LỬA BAY */
        const canvas = document.getElementById('sparks-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        let particlesArray = []; const mouse = { x: null, y: null, radius: 100 };
        window.addEventListener('mousemove', (e) => { mouse.x = e.x; mouse.y = e.y; });
        window.addEventListener('mouseout', () => { mouse.x = null; mouse.y = null; });
        window.addEventListener('resize', () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; init(); });
        
        class Particle {
            constructor(x, y, size, weight) {
                this.x = x; this.y = y; this.size = size; this.weight = weight; 
                const colors = ['#ff4d00', '#ff7300', '#ff9900', '#ffcc00'];
                this.color = colors[Math.floor(Math.random() * colors.length)]; this.opacity = Math.random() * 0.8 + 0.2;
            }
            update() {
                this.x += (Math.random() - 0.5) * 1.5; this.y -= this.weight; this.opacity -= 0.002; 
                if (mouse.x != null) {
                    let dx = mouse.x - this.x; let dy = mouse.y - this.y;
                    let distance = Math.sqrt(dx * dx + dy * dy);
                    if (distance < mouse.radius) { this.x -= dx / 20; this.y -= dy / 20; }
                }
                if (this.y < 0 || this.opacity <= 0) {
                    this.y = window.innerHeight + Math.random() * 50; this.x = Math.random() * window.innerWidth;
                    this.weight = Math.random() * 2 + 0.5; this.opacity = Math.random() * 0.8 + 0.2;
                }
            }
            draw() {
                ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color; ctx.globalAlpha = this.opacity; ctx.fill(); ctx.globalAlpha = 1; 
            }
        }
        function init() {
            particlesArray = []; let numberOfParticles = (window.innerWidth * window.innerHeight) / 7000;
            for (let i = 0; i < numberOfParticles; i++) {
                let x = Math.random() * window.innerWidth; let y = Math.random() * window.innerHeight;
                let size = Math.random() * 2.5 + 0.5; let weight = Math.random() * 2 + 0.5;
                particlesArray.push(new Particle(x, y, size, weight));
            }
        }
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particlesArray.length; i++) { particlesArray[i].update(); particlesArray[i].draw(); }
            requestAnimationFrame(animate);
        }
        init(); animate();
    </script>
</body>
</html>
