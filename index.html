<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tăng Thoại Lâm (Noway) | Portfolio</title>
    <!-- Đã thêm FontAwesome để lấy Icon Tâm ngắm -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #ff4d00;
            --bg-color: #0a0a0c; 
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
            --nav-bg: rgba(10, 10, 12, 0.85);
            --overlay-edge: rgba(10, 10, 12, 1);
            --shadow-color: rgba(0, 0, 0, 0.5);
        }

        body.light-mode {
            --primary-color: #d94300; 
            --bg-color: #f4f1ea; 
            --text-main: #1a1a1a; 
            --text-muted: #555555;
            --nav-bg: rgba(244, 241, 234, 0.85);
            --overlay-edge: rgba(244, 241, 234, 1);
            --shadow-color: rgba(255, 255, 255, 0.5);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        /* ÉP CHUỘT ẨN ĐI TRÊN MÁY TÍNH ĐỂ DÙNG CHUỘT CUSTOM */
        @media (pointer: fine) {
            body, a, button, .airdrop-container, .close-video-btn {
                cursor: none !important;
            }
        }

        body, html {
            width: 100%; height: 100%;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Times New Roman', Times, serif !important; 
            overflow: hidden;
            transition: background-color 0.5s ease, color 0.5s ease;
            perspective: 1000px; 
        }

        h1, h2, h3, h4, h5, h6, p, a, span, div, button { font-family: 'Times New Roman', Times, serif !important; }

        /* CSS CHO CON CHUỘT TÂM NGẮM SÚNG */
        .custom-cursor {
            position: fixed;
            top: 0; left: 0;
            width: 30px; height: 30px;
            color: var(--primary-color);
            font-size: 24px;
            pointer-events: none; /* Rất quan trọng: Xuyên thấu để bấm được nút ở dưới */
            z-index: 100000; /* Nằm trên cùng mọi thứ */
            transform: translate(-50%, -50%); /* Căn giữa tâm ngắm vào mũi chuột */
            display: none; /* Mặc định ẩn, JS sẽ gọi ra */
            justify-content: center; align-items: center;
            text-shadow: 0 0 10px var(--primary-color);
            transition: transform 0.15s ease-out; /* Mượt mà khi phóng to */
        }
        
        /* Hiệu ứng khi rê chuột vào mục tiêu (Hover) */
        .custom-cursor.aiming {
            transform: translate(-50%, -50%) scale(1.5) rotate(45deg);
            color: #ffffff;
            text-shadow: 0 0 15px var(--primary-color), 0 0 30px var(--primary-color);
        }

        .smoke-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, rgba(255, 77, 0, 0.05) 0%, var(--overlay-edge) 70%);
            z-index: 1; pointer-events: none;
            transition: background 0.5s ease;
        }

        #sparks-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }

        .ui-layer { position: relative; z-index: 10; width: 100%; height: 100%; display: flex; flex-direction: column; }

        .nav-right { display: flex; align-items: center; gap: 30px; }
        .theme-toggle {
            background: transparent; border: 1px solid var(--primary-color);
            color: var(--primary-color); padding: 5px 15px; border-radius: 20px;
            font-weight: bold; font-size: 1rem; transition: 0.3s;
        }
        .theme-toggle:hover { background: var(--primary-color); color: var(--bg-color); }

        nav {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 50px; background: var(--nav-bg);
            border-bottom: 1px solid rgba(255, 77, 0, 0.3); backdrop-filter: blur(5px);
            transition: background 0.5s ease;
        }
        
        .logo { font-size: 2rem; font-weight: bold; color: var(--primary-color); text-shadow: 0 0 15px rgba(255, 77, 0, 0.4); letter-spacing: 2px; text-transform: uppercase; }
        
        nav ul { list-style: none; display: flex; gap: 30px; }
        nav ul li a { color: var(--text-main); text-decoration: none; font-size: 1.2rem; text-transform: uppercase; letter-spacing: 1px; transition: 0.3s; padding-bottom: 5px; border-bottom: 2px solid transparent; font-weight: bold; }
        nav ul li a:hover, nav ul li a.active { color: var(--primary-color); border-bottom: 2px solid var(--primary-color); text-shadow: 0 0 8px rgba(255, 77, 0, 0.4); }

        .hero-content { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 20px; }

        .profile-wrapper { margin-bottom: 15px; animation: float 4s ease-in-out infinite; perspective: 1000px; }
        .tilt-box { transition: transform 0.1s ease-out; transform-style: preserve-3d; }
        .profile-img {
            width: 180px; height: 180px; border-radius: 50%; object-fit: cover;
            border: 3px solid var(--primary-color);
            box-shadow: 0 15px 35px rgba(0,0,0,0.5), 0 0 25px rgba(255, 77, 0, 0.3), inset 0 0 10px rgba(255, 77, 0, 0.3);
            transition: border-color 0.5s ease; transform: translateZ(20px); 
        }
        @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-12px); } 100% { transform: translateY(0px); } }

        .airdrop-container {
            position: absolute; top: -150px; z-index: 100;
            display: flex; flex-direction: column; align-items: center; 
            transition: transform 0.2s ease; transform-origin: top center;
        }
        .airdrop-container:hover { transform: scale(1.1) !important; filter: brightness(1.2); }
        .airdrop-img {
            width: 120px; height: auto; filter: drop-shadow(0 15px 15px rgba(0,0,0,0.6));
            animation: sway 2s ease-in-out infinite alternate; transform-origin: top center;
        }
        @keyframes sway { 0% { transform: rotate(-8deg); } 100% { transform: rotate(8deg); } }
        .shaking .airdrop-img { animation: shake 0.4s ease-in-out infinite; filter: drop-shadow(0 0 20px var(--primary-color)); }
        @keyframes shake { 0% { transform: rotate(0deg) scale(1.1); } 25% { transform: rotate(-10deg) scale(1.1); } 50% { transform: rotate(10deg) scale(1.1); } 75% { transform: rotate(-10deg) scale(1.1); } 100% { transform: rotate(0deg) scale(1.1); } }

        .video-modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.95); backdrop-filter: blur(10px);
            z-index: 9999; display: flex; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none; transition: opacity 0.4s ease;
        }
        .video-modal-overlay.active { opacity: 1; pointer-events: auto; }
        .video-content {
            position: relative; width: 85vw; max-width: 1000px; aspect-ratio: 16 / 9;
            background: #000; border: 2px solid var(--primary-color);
            box-shadow: 0 0 40px rgba(255, 77, 0, 0.5);
            transform: scale(0.8) translateY(50px); transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border-radius: 12px; overflow: hidden;
        }
        .video-modal-overlay.active .video-content { transform: scale(1) translateY(0); }
        .close-video-btn {
            position: absolute; top: -20px; right: -20px; background: rgba(0,0,0,0.8); border: 2px solid var(--primary-color);
            color: var(--primary-color); font-size: 1.5rem; font-weight: bold;
            transition: 0.3s; border-radius: 50%; width: 45px; height: 45px; z-index: 10;
        }
        .close-video-btn:hover { background: var(--primary-color); color: #fff; transform: scale(1.1) rotate(90deg); }
        .iframe-container { position: relative; width: 100%; height: 100%; }
        .iframe-container video { width: 100%; height: 100%; object-fit: contain; background: #000; }

        .hero-content h2 { color: var(--primary-color); font-size: 1.2rem; margin-bottom: 5px; letter-spacing: 3px; font-weight: bold; }
        .hero-content h1 { font-size: 5.5rem; font-weight: bold; letter-spacing: 5px; margin-bottom: 0; line-height: 1; text-shadow: 2px 4px 10px var(--shadow-color); transition: text-shadow 0.5s ease; }
        .hero-content .nickname { font-size: 3rem; color: var(--primary-color); letter-spacing: 8px; margin-top: 5px; margin-bottom: 15px; text-shadow: 0 0 15px rgba(255, 77, 0, 0.4); font-weight: bold; font-style: italic; }
        .hero-content .dynamic-text-container { font-size: 1.8rem; color: var(--text-muted); margin-bottom: 15px; margin-top: 10px; font-style: italic; transition: color 0.5s ease; }
        .hero-content .dynamic-text { color: var(--primary-color); font-weight: bold; }
        .hero-content .slogan { font-size: 1.5rem; font-style: italic; color: var(--text-muted); margin-bottom: 40px; transition: color 0.5s ease;}
        .cursor { display: inline-block; width: 8px; height: 1.5rem; background-color: var(--primary-color); vertical-align: middle; animation: blink 0.8s infinite; margin-left: 2px; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
        .btn-fire {
            display: inline-block; padding: 15px 40px; background: rgba(255, 77, 0, 0.1); color: var(--primary-color); font-size: 1.2rem; text-transform: uppercase; text-decoration: none; border: 1px solid var(--primary-color); position: relative; transition: 0.3s all ease; font-weight: bold; letter-spacing: 1px;
        }
        .btn-fire:hover { background: var(--primary-color); color: var(--bg-color); box-shadow: 0 0 20px rgba(255, 77, 0, 0.5); }
    </style>
</head>
<body>

    <!-- CON CHUỘT TÂM NGẮM -->
    <div class="custom-cursor" id="customCursor">
        <i class="fas fa-crosshairs"></i>
    </div>

    <!-- RẠP CHIẾU PHIM -->
    <div class="video-modal-overlay" id="videoModal">
        <div class="video-content">
            <button class="close-video-btn" id="closeVideoBtn">X</button>
            <div class="iframe-container">
                <video id="highlightVideo" controls playsinline>
                    <!-- TÔI ĐÃ FIX LỖI Ở ĐÂY: CHỈ GHI TÊN FILE -->
                    <source src="snaptik.vn_7586355483028573447.mp4" type="video/mp4">
                    Trình duyệt của bạn không hỗ trợ phát video.
                </video>
            </div>
        </div>
    </div>

    <div class="smoke-overlay"></div>
    <canvas id="sparks-canvas"></canvas>

    <div class="ui-layer">
        <nav>
            <div class="logo">About me</div>
            <div class="nav-right">
                <ul>
                    <li><a href="index.html" class="active">Home</a></li>
                    <li><a href="music.html">Music</a></li>
                    <li><a href="gallery.html">Gallery</a>a></li>li></a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
                <button class="theme-toggle" id="themeBtn">☀️ LIGHT</button>
            </div>
        </nav>

        <div class="hero-content">
            <div class="profile-wrapper">
                <div class="tilt-box" id="tiltBox">
                    <!-- TÔI ĐÃ FIX LỖI Ở ĐÂY: CHỈ GHI TÊN FILE -->
                    <img src="z7867355486545_8927add2849b9d923e27b3ed08b3eff2.jpg" alt="Avatar" class="profile-img">
                </div>
            </div>

            <h2>MY NAME</h2>
            <h1>Tăng Thoại Lâm</h1>
            <div class="nickname">Noway</div>
            
            <div class="dynamic-text-container">
                I am a <span class="dynamic-text" id="typewriter"></span><span class="cursor"></span>
            </div>
            
            <p class="slogan">"Love is the best thing we do."</p>
            
            <a href="contact.html" class="btn-fire">How can i help you? Let me know!</a>
        </div>
    </div>

    <script>
        /* SCRIPT XỬ LÝ CON CHUỘT TÂM NGẮM */
        const customCursor = document.getElementById('customCursor');
        
        // Chỉ bật khi người dùng xài Máy tính (Có trỏ chuột)
        if (window.matchMedia("(pointer: fine)").matches) {
            customCursor.style.display = 'flex';

            // Cho tâm ngắm đi theo chuột
            document.addEventListener('mousemove', (e) => {
                customCursor.style.left = e.clientX + 'px';
                customCursor.style.top = e.clientY + 'px';
            });

            // Tự động xoay và phóng to khi rê vào bất kỳ nút bấm, link hoặc hòm thính nào
            const interactiveElements = document.querySelectorAll('a, button, .theme-toggle, .btn-fire');
            
            interactiveElements.forEach(el => {
                el.addEventListener('mouseenter', () => customCursor.classList.add('aiming'));
                el.addEventListener('mouseleave', () => customCursor.classList.remove('aiming'));
            });
        }


        /* 3D TILT AVATAR */
        const tiltBox = document.getElementById('tiltBox');
        const profileWrapper = document.querySelector('.profile-wrapper');
        profileWrapper.addEventListener('mousemove', (e) => {
            const rect = profileWrapper.getBoundingClientRect();
            const x = e.clientX - rect.left; const y = e.clientY - rect.top;
            const centerX = rect.width / 2; const centerY = rect.height / 2;
            const rotateX = ((y - centerY) / centerY) * -25;
            const rotateY = ((x - centerX) / centerX) * 25;
            tiltBox.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.1, 1.1, 1.1)`;
        });
        profileWrapper.addEventListener('mouseleave', () => {
            tiltBox.style.transform = `rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)`;
        });

        /* EASTER EGG: AIRDROP */
        const videoModal = document.getElementById('videoModal');
        const closeVideoBtn = document.getElementById('closeVideoBtn');
        const highlightVideo = document.getElementById('highlightVideo');
        
        let hasLootedEasterEgg = false; 

        function spawnAirdrop() {
            if (hasLootedEasterEgg) return; 

            const drop = document.createElement('div');
            drop.className = 'airdrop-container';
            // TÔI ĐÃ FIX LỖI Ở ĐÂY: CHỈ GHI TÊN FILE
            drop.innerHTML = `<img src="z7867426889012_3eac5d1ab825ae635ab1d53c203017fb.jpg" alt="Airdrop" class="airdrop-img">`;
            drop.style.left = Math.random() * (window.innerWidth - 150) + 50 + 'px';
            document.body.appendChild(drop);

            // Gắn hiệu ứng ngắm bắn cho thính khi nó vừa rớt ra
            drop.addEventListener('mouseenter', () => customCursor.classList.add('aiming'));
            drop.addEventListener('mouseleave', () => customCursor.classList.remove('aiming'));

            let posY = -150;
            const speed = 1.0; 
            let isLooted = false;

            const fallInterval = setInterval(() => {
                if (isLooted) return;
                posY += speed;
                drop.style.top = posY + 'px';
                if (posY > window.innerHeight) {
                    clearInterval(fallInterval); drop.remove();
                }
            }, 20);

            drop.addEventListener('click', () => {
                if (isLooted) return;
                isLooted = true; hasLootedEasterEgg = true; 
                drop.classList.add('shaking'); 
                customCursor.classList.remove('aiming'); // Bắn xong tắt tâm ngắm
                
                setTimeout(() => {
                    drop.remove(); 
                    videoModal.classList.add('active'); 
                    highlightVideo.play(); 
                }, 800);
            });
        }

        function scheduleNextAirdrop(isFirstDrop = false) {
            if (hasLootedEasterEgg) return;
            let delay;
            if (isFirstDrop) { delay = Math.floor(Math.random() * (30000 - 15000 + 1)) + 15000; } 
            else { delay = Math.floor(Math.random() * (90000 - 45000 + 1)) + 45000; }
            setTimeout(() => {
                if (!hasLootedEasterEgg) { spawnAirdrop(); scheduleNextAirdrop(false); }
            }, delay);
        }
        scheduleNextAirdrop(true);

        closeVideoBtn.addEventListener('click', () => {
            videoModal.classList.remove('active');
            highlightVideo.pause(); highlightVideo.currentTime = 0; 
        });

        /* CÁC SCRIPT SÁNG/TỐI & HIỆU ỨNG NỀN */
        const themeBtn = document.getElementById('themeBtn');
        const body = document.body;
        if (localStorage.getItem('theme') === 'light') {
            body.classList.add('light-mode'); themeBtn.innerText = '🌙';
        } else {
            themeBtn.innerText = '☀️';
        }
        themeBtn.addEventListener('click', () => {
            body.classList.toggle('light-mode');
            if (body.classList.contains('light-mode')) {
                themeBtn.innerText = '🌙'; localStorage.setItem('theme', 'light');
            } else {
                themeBtn.innerText = '☀️'; localStorage.setItem('theme', 'dark');
            }
        });

        const canvas = document.getElementById('sparks-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        let particlesArray = []; const mouse = { x: null, y: null, radius: 100 };
        window.addEventListener('mousemove', (e) => { mouse.x = e.x; mouse.y = e.y; });
        window.addEventListener('mouseout', () => { mouse.x = null; mouse.y = null; });
        window.addEventListener('resize', () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; init(); });
        class Particle {
            constructor(x, y, size, weight) {
                this.x = x; this.y = y; this.size = size; this.weight = weight; 
                const colors = ['#ff4d00', '#ff7300', '#ff9900', '#ffcc00'];
                this.color = colors[Math.floor(Math.random() * colors.length)]; this.opacity = Math.random() * 0.8 + 0.2;
            }
            update() {
                this.x += (Math.random() - 0.5) * 1.5; this.y -= this.weight; this.opacity -= 0.002; 
                if (mouse.x != null) {
                    let dx = mouse.x - this.x; let dy = mouse.y - this.y;
                    let distance = Math.sqrt(dx * dx + dy * dy);
                    if (distance < mouse.radius) { this.x -= dx / 20; this.y -= dy / 20; }
                }
                if (this.y < 0 || this.opacity <= 0) {
                    this.y = canvas.height + Math.random() * 50; this.x = Math.random() * canvas.width;
                    this.weight = Math.random() * 2 + 0.5; this.opacity = Math.random() * 0.8 + 0.2;
                }
            }
            draw() {
                ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color; ctx.globalAlpha = this.opacity; ctx.fill(); ctx.globalAlpha = 1; 
            }
        }
        function init() {
            particlesArray = []; let numberOfParticles = (canvas.width * canvas.height) / 7000;
            for (let i = 0; i < numberOfParticles; i++) {
                let x = Math.random() * canvas.width; let y = Math.random() * canvas.height;
                let size = Math.random() * 2.5 + 0.5; let weight = Math.random() * 2 + 0.5;
                particlesArray.push(new Particle(x, y, size, weight));
            }
        }
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particlesArray.length; i++) { particlesArray[i].update(); particlesArray[i].draw(); }
            requestAnimationFrame(animate);
        }
        init(); animate();

        const words = ["IT Student", "PUBG Mobile Player", "Content Creator"];
        let wordIndex = 0; let charIndex = 0; let isDeleting = false;
        const typewriterElement = document.getElementById("typewriter");
        function typeEffect() {
            const currentWord = words[wordIndex];
            if (isDeleting) { typewriterElement.textContent = currentWord.substring(0, charIndex - 1); charIndex--; } 
            else { typewriterElement.textContent = currentWord.substring(0, charIndex + 1); charIndex++; }
            let typingSpeed = isDeleting ? 50 : 100; 
            if (!isDeleting && charIndex === currentWord.length) { typingSpeed = 2000; isDeleting = true; } 
            else if (isDeleting && charIndex === 0) { isDeleting = false; wordIndex = (wordIndex + 1) % words.length; typingSpeed = 500; }
            setTimeout(typeEffect, typingSpeed);
        }
        document.addEventListener("DOMContentLoaded", function() { setTimeout(typeEffect, 1000); });
    </script>
</body>
</html>
